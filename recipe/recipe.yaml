schema_version: 1

context:
  version: "2.0.1"

package:
  name: hygeos-core
  version: ${{ version }}

source:
  url: https://github.com/hygeos/hygeos-core/archive/refs/tags/v${{ version }}.tar.gz
  sha256: b1c080b8b93c9c5af6492c78013331236ab8490dcd5b81a9d4e1565dc0a6db55

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1
  run:
    - python >=${{ python_min }}
    - dask
    - h5netcdf
    - lxml
    - matplotlib-base
    - python-dotenv
    - toml
    - tqdm
    - xarray

tests:
  - python:
      imports:
        - hygeos_core
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A collection of common procedures for generic programming purposes
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/hygeos/hygeos-core

extra:
  recipe-maintainers:
    - fsteinmetz
    - danschef

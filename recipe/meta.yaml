{% set version = "2.0.0" %}

package:
  name: hygeos-core
  version: {{ version }}

source:
  url: https://github.com/hygeos/hygeos-core/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 05d350a9c613f55dc6ea855aa60e462b9e6ed095d9ffc455b9c4eca4cf39a225

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv
  noarch: python

requirements:
  host:
    - python {{ python_min }},<3.14
    - pip
    - poetry-core >=1
  run:
    - python >={{ python_min }},<3.14
    - dask
    - h5netcdf
    - lxml
    - python-dotenv
    - toml
    - tqdm
    - xarray

test:
  imports:
    - hygeos_core
  requires:
    - python {{ python_min }}
    - pip
  commands:
    - pip check

about:
  home: https://github.com/hygeos/hygeos-core
  summary: "A collection of common procedures for generic programming purposes"
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - fsteinmetz
    - danschef
